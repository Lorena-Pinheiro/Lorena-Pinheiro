name: Update Guestbook

on:
  issue_comment: 
    types: [ created, edited, deleted ]

permissions: 
  contents: write

jobs:
  update-guestbook:
    if: github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update guestbook
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const comments = await github.paginate(
              github.rest.issues.listComments,{
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                per_page: 100
              }
            );

            const latest = comments
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(0, 5);

            const escapeHtml = (str) => String(str)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            const truncateString = (str, num) => str.length > num 
              ? str.slice(0, num) + "..." : str;

            const formatDate = (iso) => {
              const d = new Date(iso);
              const dd = String(d.getDate()).padStart(2, '0');
              const mm = String(d.getMonth() + 1).padStart(2, '0');
              const yyyy = d.getFullYear();
              return `${dd}/${mm}/${yyyy}`;
            };

            const entriesHtml = latest.map((comment) => {
              const user = comment.user.login;
              const avatar = comment.user.avatar_url;
              const date = formatDate(comment.created_at);
              const text = escapeHtml(comment.body).replace(/\r?\n/g, '<br/>');
              const url = comment.html_url;

              return `
              <tr>
              <td><img width="80" src="${avatar}" alt="${user}"/></td>
              <td>
              <p><a href="${url}"><strong>${user} • ${date}</strong></a><br/>${truncateString(text, 125)}</p>
              </td>
              </tr>
              `
            }).join('');

            const readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!-- ENTRY -->';
            const end = '<!-- END ENTRY -->';
            const regex = new RegExp(`${start}[\\s\\S]*?${end}`);
            const replacement = `${start}\n${entriesHtml}${end}`;

            readme = readme.replace(regex, replacement);
            fs.writeFileSync('README.md', readme);
       
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update guestbook"
          file_pattern: README.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
